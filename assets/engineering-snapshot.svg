  <text x="600" y="330" text-anchor="middle" fill="#9AA7B2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4">CÓDIGO QUE RODA  ·  DECISÕES QUE DÃO PARA EXPLICAR</text>
